<nav id="sidebar" aria-label="Site navigation">
  <ul class="nav-list">
    {% for item in site.data.navigation %}
      <li class="nav-item">
        <a href="{{ item.url | relative_url }}"
           class="nav-link{% if page.url contains item.url %} active{% endif %}">
          {{ item.title }}
        </a>
        {% if item.children %}
          <ul class="nav-sublist">
            {% for child in item.children %}
              <li class="nav-subitem">
                <a href="{{ child.url | relative_url }}"
                   class="nav-sublink{% if page.url == child.url or page.url == child.url | append: '/' %} active{% endif %}">
                  {{ child.title }}
                </a>
              </li>
            {% endfor %}
          </ul>
        {% endif %}
      </li>
    {% endfor %}
  </ul>
</nav>
